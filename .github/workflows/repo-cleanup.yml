name: "One-time repository source cleanup"
on:
  push:
    branches: [fix/media-player-adblock-mp4-1.0.6]
    paths:
      - '.maintenance/cleanup-request.txt'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify complete Android resources and clean old archives
        shell: bash
        run: |
          set -euo pipefail
          test -s VRBrowser-1.0.5.zip
          unzip -tq VRBrowser-1.0.5.zip
          tmp="$(mktemp -d)"
          unzip -q VRBrowser-1.0.5.zip -d "$tmp"
          test -s "$tmp/app/src/main/res/values/styles.xml"
          test -s "$tmp/app/src/main/res/drawable/vr_wallpaper.jpg"
          test -s "$tmp/app/src/main/res/drawable/vr_logo_back.jpg"
          test -s "$tmp/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          grep -qs 'name="VRTheme"' "$tmp/app/src/main/res/values/styles.xml"
          mkdir -p app/src/main/res
          cp -a "$tmp/app/src/main/res/." app/src/main/res/
          rm -f app/src/main/res/mipmap-mdpi/.gitkeep
          git ls-files -z '*.zip' | xargs -0 -r git rm -f --
          git rm -f -- .maintenance/cleanup-request.txt
          git add -A app/src/main/res
          echo "Remaining tracked ZIP archives:"
          git ls-files '*.zip'
          echo "Included Android resources:"
          git ls-files app/src/main/res
          test -s app/src/main/res/drawable/vr_wallpaper.jpg
          test -s app/src/main/res/values/styles.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize full V&R Browser 1.0.7 Android source tree and remove obsolete archives"
          git push origin HEAD:fix/media-player-adblock-mp4-1.0.6
