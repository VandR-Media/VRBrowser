name: V&R Browser 1.0.5 — verified signed APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/resumable-hls-downloads-1.0.5
    paths:
      - 'VRBrowser-1.0.5.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="VRBrowser-1.0.5.zip"
          test -s "$ARCHIVE" || { echo "::error::Missing $ARCHIVE"; exit 1; }
          unzip -tq "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/vrbrowser-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vrbrowser-source"
          GRADLE_FILE="$RUNNER_TEMP/vrbrowser-source/app/build.gradle.kts"
          test -s "$GRADLE_FILE"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*1005([^0-9]|$)' "$GRADLE_FILE"
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1\.0\.5"' "$GRADLE_FILE"
          echo "PROJECT_DIR=$RUNNER_TEMP/vrbrowser-source" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate persistent signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          test -n "$KEY" || { echo "::error::Missing VR_KEYSTORE_BASE64 / VR_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Missing release signing secrets"; exit 1; }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Restore persistent release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build signed Release APK
        shell: bash
        working-directory: ${{ runner.temp }}/vrbrowser-source
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1005'"* ]]
          [[ "$META" == *"versionName='1.0.5'"* ]]
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/vr-output"
          cp "$APK" "$RUNNER_TEMP/vr-output/VRBrowser-1.0.5-signed-release.apk"
          sha256sum "$RUNNER_TEMP/vr-output/VRBrowser-1.0.5-signed-release.apk"
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.5-SIGNED-RELEASE
          path: ${{ runner.temp }}/vr-output/VRBrowser-1.0.5-signed-release.apk
          if-no-files-found: error
          retention-days: 30
