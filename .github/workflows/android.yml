name: V&R Browser 1.0.1 — ZIP only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VRBrowser-1.0.1.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout archive and workflow
        uses: actions/checkout@v4
      - name: Extract ONLY project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f VRBrowser-1.0.1.zip || { echo 'Missing VRBrowser-1.0.1.zip at repository root'; exit 1; }
          mkdir -p "$RUNNER_TEMP/vr-source"
          unzip -q VRBrowser-1.0.1.zip -d "$RUNNER_TEMP/vr-source"
          test -f "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/vr-source/settings.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/vr-source" >> "$GITHUB_ENV"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*1001([^0-9]|$)' "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1.0.1"' "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Signing secrets absent; debug APK only (not a reliable in-place update).'
          fi
      - name: Restore signing keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build APK from extracted ZIP ONLY
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ "$SIGNED" == 'true' ]]; then
            gradle --no-daemon :app:assembleRelease
          else
            unset VR_KEYSTORE_PATH
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Verify package and version
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [[ "$SIGNED" == 'true' ]]; then FLAVOR=release; else FLAVOR=debug; fi
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/$FLAVOR" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1001'"* ]]
          [[ "$META" == *"versionName='1.0.1'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/vr-output"
          cp "$APK" "$RUNNER_TEMP/vr-output/VRBrowser-1.0.1-$FLAVOR.apk"
          echo "OUTPUT_DIR=$RUNNER_TEMP/vr-output" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.1-from-ZIP
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error
