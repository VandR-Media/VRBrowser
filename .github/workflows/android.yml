name: Build V&R Browser (verified APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Read project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          CODE="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$FILE" | head -n 1)"
          NAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$FILE" | head -n 1)"
          test -n "$CODE" && test -n "$NAME"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building V&R Browser $NAME ($CODE)"
      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Signing secrets absent: debug APK only. Debug APK cannot reliably update a previously installed app.'
          fi
      - name: Restore persistent signing key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECT_CODE: ${{ steps.version.outputs.code }}
          EXPECT_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='$EXPECT_CODE'"* ]]
          [[ "$META" == *"versionName='$EXPECT_NAME'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p verified-apk
          cp "$APK" "verified-apk/VRBrowser-${EXPECT_NAME}-release-signed.apk"
          sha256sum verified-apk/*.apk
      - name: Upload signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-${{ steps.version.outputs.name }}-signed-release
          path: verified-apk/*.apk
          if-no-files-found: error
      - name: Build Debug APK (fallback)
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Debug APK
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        env:
          EXPECT_CODE: ${{ steps.version.outputs.code }}
          EXPECT_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='$EXPECT_CODE'"* ]]
          [[ "$META" == *"versionName='$EXPECT_NAME'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p verified-apk
          cp "$APK" "verified-apk/VRBrowser-${EXPECT_NAME}-debug.apk"
          sha256sum verified-apk/*.apk
      - name: Upload Debug APK (fallback)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-${{ steps.version.outputs.name }}-debug
          path: verified-apk/*.apk
          if-no-files-found: error
