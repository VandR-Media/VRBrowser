name: V&R Browser 1.0.4 — signed release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_B64:-$KEYSTORE_BASE64}"
          test -n "$KEY" && test -n "$VR_KEYSTORE_PASSWORD" && test -n "$VR_KEY_ALIAS" && test -n "$VR_KEY_PASSWORD" || { echo 'Signing secrets missing'; exit 1; }
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          echo "VR_KEYSTORE_PATH=$RUNNER_TEMP/vrbrowser-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1004'"* ]]
          [[ "$META" == *"versionName='1.0.4'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.4-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
