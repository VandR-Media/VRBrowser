name: Build VRBrowser APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack V&R Browser 0.6.1
        run: |
          mkdir -p vrbrowser061
          unzip -q VRBrowser061.zip -d vrbrowser061
      - name: Restore private signing key
        env:
          VR_KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
        run: |
          test -n "$VR_KEYSTORE_B64"
          printf '%s' "$VR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build signed Release APK
        working-directory: vrbrowser061
        env:
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          export VR_KEYSTORE_PATH="$RUNNER_TEMP/vrbrowser-signing.jks"
          gradle --no-daemon assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-061-signed-apk
          path: vrbrowser061/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
