name: V&R Browser 1.0.4 — signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_B64:-${KEYSTORE_BASE64:-}}"
          if [[ -z "$KEY" || -z "$VR_KEYSTORE_PASSWORD" || -z "$VR_KEY_ALIAS" || -z "$VR_KEY_PASSWORD" ]]; then
            echo 'ERROR: Missing signing secrets'; exit 1
          fi
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          echo "VR_KEYSTORE_PATH=$RUNNER_TEMP/vrbrowser-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Locate APK and verify metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          echo 'APK output directory:'
          ls -lah app/build/outputs/apk/release/ || true
          mapfile -d '' APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -size +0c -print0 2>/dev/null)
          if (( ${#APKS[@]} == 0 )); then
            echo 'ERROR: No APK produced in release output directory'
            find app/build/outputs -type f -maxdepth 6 -print || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Found APK: $APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          META="$(grep -m 1 '^package:' "$RUNNER_TEMP/apk-badging.txt")"
          echo "Actual APK metadata: $META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]] || { echo 'ERROR: package name mismatch'; exit 1; }
          [[ "$META" == *"versionCode='1004'"* ]] || { echo 'ERROR: versionCode mismatch'; exit 1; }
          [[ "$META" == *"versionName='1.0.4'"* ]] || { echo 'ERROR: versionName mismatch'; exit 1; }
          "$SIGNER" verify --verbose --print-certs "$APK"
          echo 'APK metadata and signature verified successfully'
      - name: Upload release APK (even if verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.4-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
