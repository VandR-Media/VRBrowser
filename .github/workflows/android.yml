name: Build VRBrowser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract V&R Browser 0.3.1
        run: |
          ARCHIVE="VRBrowser-0.3.1-REPACK.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Update archive not found!"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/vr-update
          unzip -o "$ARCHIVE" -d /tmp/vr-update

          rm -rf app
          cp -a /tmp/vr-update/app ./app

          cp /tmp/vr-update/build.gradle.kts .
          cp /tmp/vr-update/settings.gradle.kts .
          cp /tmp/vr-update/gradle.properties .

          sed -i 's#android.permission/POST_NOTIFICATIONS#android.permission.POST_NOTIFICATIONS#g' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-0.3.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
