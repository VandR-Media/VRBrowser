name: Build VRBrowser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V&R Browser 0.5 source
        shell: bash
        run: |
          set -euo pipefail
          test -f VRBrowser05.zip
          mkdir -p vrbrowser05
          unzip -q VRBrowser05.zip -d vrbrowser05
          test -f vrbrowser05/settings.gradle.kts
          test -f vrbrowser05/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: vrbrowser05
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-0.5-debug-apk
          path: vrbrowser05/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
