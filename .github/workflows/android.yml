name: V&R Browser - build ONLY from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VRBrowser-1.0.0-FIXED.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout archive and workflow
        uses: actions/checkout@v4

      - name: Extract ONLY the uploaded archive
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/VRBrowser-1.0.0-FIXED.zip"
          test -s "$ARCHIVE" || { echo '::error::Upload VRBrowser-1.0.0-FIXED.zip to the repository root.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/vr-source"
          python3 - "$ARCHIVE" "$RUNNER_TEMP/vr-source" <<'PY'
          import os, pathlib, sys, zipfile
          archive, destination = sys.argv[1:]
          root = pathlib.Path(destination).resolve()
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad: raise SystemExit(f'Corrupt ZIP entry: {bad}')
              for entry in z.infolist():
                  name = entry.filename
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name:
                      raise SystemExit(f'Unsafe ZIP entry: {name}')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'Symlinks are not allowed: {name}')
              z.extractall(root)
          print('Extracted archive into', root)
          PY
          test -f "$RUNNER_TEMP/vr-source/app/build.gradle.kts" || { echo '::error::ZIP must contain app/build.gradle.kts at its top level.'; exit 1; }
          test -f "$RUNNER_TEMP/vr-source/settings.gradle.kts" || { echo '::error::ZIP must contain settings.gradle.kts at its top level.'; exit 1; }
          echo "SOURCE_DIR=$RUNNER_TEMP/vr-source" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"

      - name: Verify version INSIDE archive
        run: |
          set -euo pipefail
          FILE="$SOURCE_DIR/app/build.gradle.kts"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*1000([;[:space:]]|$)' "$FILE" || { echo '::error::ZIP versionCode must be 1000.'; exit 1; }
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1\.0\.0"' "$FILE" || { echo '::error::ZIP versionName must be 1.0.0.'; exit 1; }
          echo 'Confirmed: archive contains V&R Browser 1.0.0 (1000).'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Detect persistent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No permanent signing secrets. Building debug APK.'
          fi

      - name: Restore signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"

      - name: Build release APK from extracted archive
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ runner.temp }}/vr-source
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug APK from extracted archive
        if: steps.signing.outputs.enabled != 'true'
        working-directory: ${{ runner.temp }}/vr-source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and prepare artifact
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [[ "$SIGNED" == 'true' ]]; then
            DIR="$SOURCE_DIR/app/build/outputs/apk/release"
            OUT='VRBrowser-1.0.0-release-signed.apk'
          else
            DIR="$SOURCE_DIR/app/build/outputs/apk/debug"
            OUT='VRBrowser-1.0.0-debug.apk'
          fi
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo '::error::No APK found.'; exit 1; }
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "${META%%$'\n'*}"
          FIRST="${META%%$'\n'*}"
          [[ "$FIRST" == *"name='com.vrbrowser.app'"* ]] || { echo '::error::Wrong package name.'; exit 1; }
          [[ "$FIRST" == *"versionCode='1000'"* ]] || { echo '::error::Wrong versionCode.'; exit 1; }
          [[ "$FIRST" == *"versionName='1.0.0'"* ]] || { echo '::error::Wrong versionName.'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/verified-apk"
          cp "$APK" "$GITHUB_WORKSPACE/verified-apk/$OUT"
          sha256sum "$GITHUB_WORKSPACE/verified-apk/$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.0-from-ZIP
          path: verified-apk/*.apk
          if-no-files-found: error
