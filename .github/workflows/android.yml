name: V&R Browser 1.0.11 — native player, MP4 and ad filtering
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/shield-hardening-1.0.11
      - fix/1.0.11-startup-audio-hls-fullscreen
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
concurrency:
  group: vrbrowser-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tracked Android source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/values/styles.xml
          test -s app/src/main/res/drawable/vr_wallpaper.jpg
          test -s app/src/main/res/drawable/vr_logo_back.jpg
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -qs 'name="VRTheme"' app/src/main/res/values/styles.xml
          if git ls-files -- '*.zip' | grep -q .; then
            echo "::error::Unexpected legacy ZIP archives are tracked"
            exit 1
          fi
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "Building canonical tracked sources only."
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate persistent signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          test -n "$KEY" || { echo "::error::Missing VR_KEYSTORE_BASE64 / VR_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Missing release signing secrets"; exit 1; }
      - name: Restore persistent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Static security gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'safeBrowsingEnabled=true' app/src/main/java/com/vrbrowser/app/MainActivity.kt
          grep -Fq 'handler?.cancel()' app/src/main/java/com/vrbrowser/app/MainActivity.kt
          grep -Fq 'allowFileAccess=false' app/src/main/java/com/vrbrowser/app/MainActivity.kt
          grep -Fq 'setAcceptThirdPartyCookies' app/src/main/java/com/vrbrowser/app/MainActivity.kt
          echo "Security source gates passed"
      - name: Build signed Release APK
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1011'"* ]]
          [[ "$META" == *"versionName='1.0.11'"* ]]
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/vr-output"
          cp "$APK" "$RUNNER_TEMP/vr-output/VRBrowser-1.0.11-signed-release.apk"
          sha256sum "$RUNNER_TEMP/vr-output/VRBrowser-1.0.11-signed-release.apk"
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.11-SIGNED-RELEASE
          path: ${{ runner.temp }}/vr-output/VRBrowser-1.0.11-signed-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/VRBrowser-1.0.11-SOURCE.zip" HEAD
          unzip -tq "$RUNNER_TEMP/VRBrowser-1.0.11-SOURCE.zip"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.11-SOURCE
          path: ${{ runner.temp }}/VRBrowser-1.0.11-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
