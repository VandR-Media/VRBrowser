name: V&R Browser 1.0.3 — ZIP only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VRBrowser-1.0.3.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout archive and workflow
        uses: actions/checkout@v4
      - name: Extract ONLY project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f VRBrowser-1.0.3.zip || { echo 'Missing VRBrowser-1.0.3.zip at repository root'; exit 1; }
          mkdir -p "$RUNNER_TEMP/vr-source"
          unzip -q VRBrowser-1.0.3.zip -d "$RUNNER_TEMP/vr-source"
          test -f "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/vr-source/settings.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/vr-source" >> "$GITHUB_ENV"
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*1003([^0-9]|$)' "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1.0.3"' "$RUNNER_TEMP/vr-source/app/build.gradle.kts"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Require all four signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          echo 'All four signing secrets are configured.'
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_B64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          echo "VR_KEYSTORE_PATH=$RUNNER_TEMP/vrbrowser-signing.jks" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks" || { echo '::error::Decoded keystore is empty'; exit 1; }
      - name: Build SIGNED RELEASE APK from extracted ZIP ONLY
        shell: bash
        env:
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$VR_KEYSTORE_PATH" || { echo "::error::Keystore file missing"; exit 1; }
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease
      - name: Verify release version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK" || { echo '::error::Release APK missing'; exit 1; }
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1003'"* ]]
          [[ "$META" == *"versionName='1.0.3'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/vr-output"
          cp "$APK" "$RUNNER_TEMP/vr-output/VRBrowser-1.0.3-signed-release.apk"
          echo "OUTPUT_DIR=$RUNNER_TEMP/vr-output" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.3-SIGNED-RELEASE
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error
