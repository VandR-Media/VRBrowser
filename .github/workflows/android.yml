name: Build V&R Browser 0.9.3 from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VRBrowser-0.9.3.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact 0.9.3 sources
        shell: bash
        run: |
          set -euo pipefail
          test -f VRBrowser-0.9.3.zip || { echo 'Missing VRBrowser-0.9.3.zip in repository root'; exit 1; }
          mkdir -p extracted-project
          unzip -q VRBrowser-0.9.3.zip -d extracted-project
          test -f extracted-project/app/build.gradle.kts
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*903' extracted-project/app/build.gradle.kts
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"0\.9\.3"' extracted-project/app/build.gradle.kts
          echo 'Verified source archive version 0.9.3 (903)'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build Debug APK from archive
        working-directory: extracted-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK version and copy
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find extracted-project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='903'"* ]]
          [[ "$META" == *"versionName='0.9.3'"* ]]
          mkdir -p verified-apk
          cp "$APK" verified-apk/VRBrowser-0.9.3-debug.apk
          sha256sum verified-apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-0.9.3-debug
          path: verified-apk/VRBrowser-0.9.3-debug.apk
          if-no-files-found: error
