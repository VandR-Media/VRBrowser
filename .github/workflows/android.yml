name: V&R Browser 1.0.6 — native player, MP4 and ad filtering
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/media-player-adblock-mp4-1.0.6
    paths:
      - 'VRBrowser-1.0.5.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate full source archive and overlay tracked sources
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="VRBrowser-1.0.5.zip"
          test -s "$ARCHIVE" || { echo "::error::Missing complete Android source archive"; exit 1; }
          unzip -tq "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/vrbrowser-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vrbrowser-source"
          PROJECT_DIR="$RUNNER_TEMP/vrbrowser-source"
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -d "$PROJECT_DIR/app/src/main/res"
          grep -Rqs 'name="VRTheme"' "$PROJECT_DIR/app/src/main/res" || { echo "::error::The base archive is missing VRTheme resources"; exit 1; }
          rm -rf "$PROJECT_DIR/app/src/main/java"
          mkdir -p "$PROJECT_DIR/app/src/main"
          cp -a app/src/main/java "$PROJECT_DIR/app/src/main/java"
          cp -a app/src/main/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          cp -a app/build.gradle.kts "$PROJECT_DIR/app/build.gradle.kts"
          cp -a build.gradle.kts "$PROJECT_DIR/build.gradle.kts"
          cp -a settings.gradle.kts "$PROJECT_DIR/settings.gradle.kts"
          cp -a gradle.properties "$PROJECT_DIR/gradle.properties"
          cp -a README.md "$PROJECT_DIR/README.md"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Complete resources retained; tracked Kotlin and Gradle sources overlaid."
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate persistent signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          test -n "$KEY" || { echo "::error::Missing VR_KEYSTORE_BASE64 / VR_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Missing release signing secrets"; exit 1; }
      - name: Restore persistent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEY="${KEYSTORE_BASE64:-${KEYSTORE_B64:-}}"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
          test -s "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build signed Release APK
        shell: bash
        working-directory: ${{ runner.temp }}/vrbrowser-source
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='1006'"* ]]
          [[ "$META" == *"versionName='1.0.6'"* ]]
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/vr-output"
          cp "$APK" "$RUNNER_TEMP/vr-output/VRBrowser-1.0.6-signed-release.apk"
          sha256sum "$RUNNER_TEMP/vr-output/VRBrowser-1.0.6-signed-release.apk"
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.6-SIGNED-RELEASE
          path: ${{ runner.temp }}/vr-output/VRBrowser-1.0.6-signed-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/VRBrowser-1.0.6-SOURCE.zip" . -x '*/build/*' '.gradle/*' '*/.gradle/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-1.0.6-SOURCE
          path: ${{ runner.temp }}/VRBrowser-1.0.6-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
