name: Build V&R Browser 0.9.2 (APK version verified)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore exact 0.9.2 source from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="VRBrowser-0.9.2.zip"
          test -f "$ARCHIVE" || { echo "ERROR: Upload VRBrowser-0.9.2.zip to the repository root."; exit 1; }
          mkdir -p "$RUNNER_TEMP/vrbrowser-source"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/vrbrowser-source"
          SRC="$RUNNER_TEMP/vrbrowser-source"
          test -f "$SRC/app/build.gradle.kts"
          rm -rf app
          cp -a "$SRC/app" ./app
          cp "$SRC/build.gradle.kts" "$SRC/settings.gradle.kts" "$SRC/gradle.properties" ./
          grep -F 'versionCode = 902; versionName = "0.9.2"' app/build.gradle.kts || {
            echo 'ERROR: Unexpected version in source archive.'; exit 1;
          }
          echo 'Building the exact source from VRBrowser-0.9.2.zip'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing secrets missing: building debug APK only.'
          fi
      - name: Restore persistent signing key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vrbrowser-signing.jks"
          chmod 600 "$RUNNER_TEMP/vrbrowser-signing.jks"
      - name: Build signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          VR_KEYSTORE_PATH: ${{ runner.temp }}/vrbrowser-signing.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed Release APK metadata
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='902'"* ]]
          [[ "$META" == *"versionName='0.9.2'"* ]]
          mkdir -p verified-apk
          cp "$APK" verified-apk/VRBrowser-0.9.2-release-signed.apk
          sha256sum verified-apk/*.apk
      - name: Upload signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-0.9.2-signed-release
          path: verified-apk/VRBrowser-0.9.2-release-signed.apk
          if-no-files-found: error
      - name: Build Debug APK (fallback)
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Debug APK metadata
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          META="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$META"
          [[ "$META" == *"name='com.vrbrowser.app'"* ]]
          [[ "$META" == *"versionCode='902'"* ]]
          [[ "$META" == *"versionName='0.9.2'"* ]]
          mkdir -p verified-apk
          cp "$APK" verified-apk/VRBrowser-0.9.2-debug-verified.apk
          sha256sum verified-apk/*.apk
      - name: Upload Debug APK (fallback)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRBrowser-0.9.2-debug-verified
          path: verified-apk/VRBrowser-0.9.2-debug-verified.apk
          if-no-files-found: error
